<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>LinguaGua Brand Guideline</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<aside class="sidebar">
    <div class="logo-text">LinguaGua</div>
    <p style="font-size: 14px; color: var(--lg-primary);">Learn Chinese Joyfully </p>
</aside>

<main class="main-content">
    <section id="identity">
        <h1>品牌核心定位</h1>
        <p>现代几何无衬线风格，整体简洁、圆润、亲和、年轻化 [cite: 9]。</p>
    </section>

    <section id="colors">
        <h2>色彩系统 (Colors)</h2>
        <div class="color-grid">
            <div class="color-card">
                <div class="swatch" style="background: var(--lg-primary);"></div>
                <div class="swatch-label">品牌绿 #39B067 </div>
            </div>
            <div class="color-card">
                <div class="swatch" style="background: var(--lg-bg-soft);"></div>
                <div class="swatch-label">背景淡色 #CDF0F1 </div>
            </div>
            <div class="color-card">
                <div class="swatch" style="background: var(--moba-bright-green);"></div>
                <div class="swatch-label">墨宝亮绿 #88E744 [cite: 45]</div>
            </div>
        </div>
    </section>

    <section id="rules" style="margin-top: 60px;">
        <h2>Logo 禁止行为 </h2>
        <div class="warning-box">
            <ul>
                <li>禁止使用全大写 (LINGUAGUA) 或全小写 (linguagua) [cite: 13, 27]。</li>
                <li>禁止添加描边、阴影或渐变特效 [cite: 25]。</li>
                <li>禁止拉伸、压扁或改变原始比例 [cite: 18, 26]。</li>
            </ul>
        </div>
    </section>
</main>

</body>
</html>
