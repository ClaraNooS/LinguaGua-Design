<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>LinguaGua 品牌指南</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="sidebar">
        <h2>LinguaGua</h2>
        <ul>
            <li><a href="#identity">核心定位</a></li>
            <li><a href="#colors">色彩系统</a></li>
            <li><a href="#logo-rules">Logo 使用规范</a></li>
        </ul>
    </nav>

    <main class="content">
        <section id="identity">
            <h1>品牌核心定位</h1>
            <p><strong>LinguaGua</strong> 采用现代几何无衬线字体，整体风格简洁、圆润、亲和、年轻化 [cite: 9]。</p>
            <p>传递“轻松学语言、高效做沟通”的品牌理念 [cite: 9]。</p>
        </section>

        <section id="colors">
            <h1>色彩系统 (Colors)</h1>
            <h3>品牌主色</h3>
            <div class="swatch-group">
                <div class="swatch" style="background: var(--lg-color-primary);">
                    <span>#39B067</span>
                </div>
                <div class="swatch" style="background: var(--lg-color-bg-light); color: #39B067;">
                    <span>#CDF0F1</span>
                </div>
            </div>
        </section>

        <section id="logo-rules">
            <h1>Logo 禁止行为</h1>
            <ul style="color: var(--lg-color-error);">
                <li>禁止拆分 "Lingua" 与 "Gua" [cite: 23]。</li>
                <li>禁止添加描边、阴影或渐变 [cite: 25]。</li>
                <li>禁止拉伸、旋转或扭曲文字 [cite: 26]。</li>
            </ul>
        </section>
    </main>
</body>
</html>
